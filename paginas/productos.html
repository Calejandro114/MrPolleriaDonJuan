<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo | Mr. Pollería Don Juan</title>
  <link rel="icon" type="image/webp" href="../img/logo.webp?v=2">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Globales y Componentes Base -->
  <link rel="stylesheet" href="../css/globales/base.css">
  <link rel="stylesheet" href="../css/globales/layout.css">
  <link rel="stylesheet" href="../css/componentes/buttons.css">
  <link rel="stylesheet" href="../css/componentes/nav.css">
  <link rel="stylesheet" href="../css/componentes/modal.css">
  <link rel="stylesheet" href="../css/componentes/footer.css">

  <!-- Estilos del Banner Hero de la Portada -->
  <link rel="stylesheet" href="../css/paginas/inicio/header.css">
  <link rel="stylesheet" href="../css/paginas/inicio/banners.css">

  <!-- Estilos Exclusivos del Catálogo -->
  <link rel="stylesheet" href="../css/paginas/productos/categories.css">
  <link rel="stylesheet" href="../css/paginas/productos/filters.css">
  <link rel="stylesheet" href="../css/paginas/productos/products.css">
</head>

<body>

  <!-- 1. BANNER HERO CON LOGO Y TARJETA TRANSLÚCIDA -->
  <header class="hero-header" id="inicio">
    <div class="hero-card">
      <img src="../img/logo.webp" alt="Mr. Pollería Don Juan Logo" class="logo-hero" onerror="this.onerror=null; this.src='https://placehold.co/110x110?text=Don+Juan';">
      <div class="hero-text">
        <h1>Mr. Pollería Don Juan</h1>
        <p class="tagline">Impresión 3D, Corte Láser y Regalos Personalizados</p>
      </div>
    </div>
  </header>

  <!-- 2. BARRA DE NAVEGACIÓN PEGAJOSA (Con navbar-scrolled activa por defecto) -->
  <nav class="sticky-navbar navbar-scrolled">
    <div class="nav-brand">
      <img src="../img/logo.webp" alt="Logo" class="logo-mini" onerror="this.onerror=null; this.src='https://placehold.co/32x32?text=DJ';">
      <span class="brand-title">Mr.Pollería Don Juan</span>
    </div>
    <div id="nav-wrapper"></div>
  </nav>

  <!-- 3. CONTENIDO DEL CATÁLOGO -->
  <div class="container">
    
    <section id="catalogo-seccion" style="margin-top: 30px;">
      
      <!-- Panel de Búsqueda y Lupa -->
      <div class="search-section-wrapper">
        <div class="search-bar-trigger">
          <span class="search-label"><i class="fa-solid fa-filter"></i> Filtrar y Buscar Productos</span>
          <button id="toggle-search-btn" class="btn-icon" title="Buscar y Filtrar">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
        </div>
        <div id="search-filter-wrapper"></div>
      </div>

      <!-- Categorías ("Todos", "3D", "Llaveros", etc.) -->
      <nav id="categories-container" class="categories-wrapper"></nav>

      <!-- Grilla Completa de Productos -->
      <main>
        <div id="products-grid" class="products-grid"></div>
      </main>

    </section>

  </div>

  <!-- Pie de página -->
  <div id="footer-container"></div>

  <!-- Contenedor para el Modal de Imagen -->
  <div id="modal-container"></div>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <!-- Script Principal del Catálogo -->
  <script type="module" src="../js/paginas/productos/main-productos.js"></script>
</body>
</html>
