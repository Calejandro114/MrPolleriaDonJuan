<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moderación de Reseñas | Panel Admin</title>
  <link rel="stylesheet" href="../css/globales/base.css">

      <div>
        <h2 style="color: #f8fafc; margin: 0;">Panel de Moderación</h2>
