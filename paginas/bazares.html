<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eventos y Bazares | Mr. Pollería Don Juan</title>
  <link rel="icon" type="image/webp" href="../img/logo.webp?v=2">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Globales y Componentes Base -->
  <link rel="stylesheet" href="../css/globales/base.css">
  <link rel="stylesheet" href="../css/globales/layout.css">
  <link rel="stylesheet" href="../css/componentes/buttons.css">
  <link rel="stylesheet" href="../css/componentes/nav.css">
  <link rel="stylesheet" href="../css/componentes/modal.css">
  <link rel="stylesheet" href="../css/componentes/footer.css">

  <!-- Estilo específico de Bazares -->

<body>

  <!-- Barra de Navegación Pegajosa -->
  <nav class="sticky-navbar">
    <div class="nav-brand">
      <img src="../img/logo.webp" alt="Logo" class="logo-mini" onerror="this.onerror=null; this.src='https://placehold.co/32x32?text=DJ';">
      <span class="brand-title">Mr.Pollería Don Juan</span>
    </div>
    <div id="nav-wrapper"></div>
  </nav>

  <!-- Contenido Principal -->
  <main class="container">
    <section class="section-block">
      <h1 class="section-title">Nuestra Presencia en Bazares y Eventos</h1>
      <p style="text-align: center; color: #94a3b8; margin-bottom: 20px;">
        Encuéntranos en los próximos eventos locales o revive nuestras ediciones anteriores.
      </p>

      <!-- Contenedor dinámico o tarjetas de eventos -->
      <div id="bazares-grid"></div>
    </section>
  </main>

  <!-- Pie de página y Modal dinámicos -->
  <div id="footer-container"></div>
  <div id="modal-container"></div>

  <!-- Script Principal de la vista -->
  <script type="module" src="../js/paginas/bazares/main-bazares.js"></script>

</html>
