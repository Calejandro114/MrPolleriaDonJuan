<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto | Mr. Pollería Don Juan</title>
  <link rel="icon" type="image/webp" href="../img/logo.webp?v=2">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Configuración PWA & SEO OpenGraph para WhatsApp -->
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta property="og:title" content="Contacto & Cotizaciones | Mr. Pollería Don Juan">
  <meta property="og:description" content="Conoce nuestro taller y ponte en contacto directo para cotizar tus proyectos 3D o corte láser.">
  <meta property="og:image" content="../img/logo.webp">
  <meta property="og:type" content="website">

  <!-- Componentes Base -->
  <link rel="stylesheet" href="../css/globales/base.css">
  <link rel="stylesheet" href="../css/globales/layout.css">
  <link rel="stylesheet" href="../css/componentes/buttons.css">
  <link rel="stylesheet" href="../css/componentes/nav.css">
  <link rel="stylesheet" href="../css/componentes/modal.css">
  <link rel="stylesheet" href="../css/componentes/footer.css">

  <!-- Header / Hero Banner -->
  <link rel="stylesheet" href="../css/paginas/inicio/header.css">

  <!-- Registro del Service Worker para PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('../sw.js')
          .then(reg => console.log('PWA Service Worker registrado', reg))
          .catch(err => console.error('Error registrando Service Worker', err));
      });
    }
  </script>
</head>
<body>

  <!-- HERO HEADER -->
  <header class="hero-header" id="inicio">
    <div class="hero-card">
      <img src="../img/logo.webp" alt="Logo" class="logo-hero" onerror="this.onerror=null; this.src='https://placehold.co/110x110?text=Don+Juan';">
      <div class="hero-text">
        <h1>Mr. Pollería Don Juan</h1>
        <p class="tagline">Impresión 3D, Corte Láser y Regalos Personalizados</p>
      </div>
    </div>
  </header>

  <!-- NAVBAR -->
  <nav class="sticky-navbar">
    <div class="nav-brand">
      <img src="../img/logo.webp" alt="Logo" class="logo-mini" onerror="this.onerror=null; this.src='https://placehold.co/32x32?text=DJ';">
      <span class="brand-title">Mr.Pollería Don Juan</span>
    </div>
    <div id="nav-wrapper"></div>
  </nav>

  <!-- CONTENIDO DE CONTACTO / QUIÉN SOY -->
  <div class="container" style="margin-top: 30px;">
    <h2>¿Quiénes Somos?</h2>
    <p style="color: #cbd5e1;">Información sobre el taller, cómo trabajamos y canales directos para cotizar pedidos personalizados.</p>
  </div>

  <!-- FOOTER Y MODAL -->
  <div id="footer-container"></div>
  <div id="modal-container"></div>

  <script type="module" src="../js/paginas/contacto/main-contacto.js"></script>
</body>
</html>
