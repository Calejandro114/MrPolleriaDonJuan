<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mr. Pollería Don Juan</title>
  <link rel="icon" type="image/webp" href="img/logo.webp?v=2">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Configuración PWA & SEO OpenGraph para WhatsApp -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta property="og:title" content="Mr. Pollería Don Juan | Impresión 3D & Personalizados">
  <meta property="og:description" content="Catálogo interactivo de figuras 3D, llaveros, corte láser y regalos personalizados. ¡Haz tu pedido directo por WhatsApp!">
  <meta property="og:image" content="img/logo.webp">
  <meta property="og:type" content="website">

  <!-- Globales y Componentes Base -->
  <link rel="stylesheet" href="css/globales/base.css">
  <link rel="stylesheet" href="css/globales/layout.css">
  <link rel="stylesheet" href="css/componentes/buttons.css">
  <link rel="stylesheet" href="css/componentes/nav.css?v=2">
  <link rel="stylesheet" href="css/componentes/modal.css">
  <link rel="stylesheet" href="css/componentes/footer.css">

  <!-- Estilos de Inicio -->
  <link rel="stylesheet" href="css/paginas/inicio/header.css">
  <link rel="stylesheet" href="css/paginas/inicio/banners.css">
  <link rel="stylesheet" href="css/paginas/inicio/carousel.css">
  <link rel="stylesheet" href="css/paginas/inicio/destacados.css?v=2">
  <link rel="stylesheet" href="css/paginas/inicio/btn-catalog.css">
  
  <!-- Estilos para las tarjetas de productos -->
  <link rel="stylesheet" href="css/paginas/productos/products.css">

  <!-- Registro del Service Worker para PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('PWA Service Worker registrado', reg))
          .catch(err => console.error('Error registrando Service Worker', err));
      });
    }
  </script>
</head>

<body>

  <!-- 1. BLOQUE PRINCIPAL (HERO / BANNER) -->
  <header class="hero-header" id="inicio">
    <div class="hero-card">
      <img src="img/logo.webp" alt="Mr. Pollería Don Juan Logo" class="logo-hero" onerror="this.onerror=null; this.src='https://placehold.co/110x110?text=Don+Juan';">
      <div class="hero-text">
        <h1>Mr. Pollería Don Juan</h1>
        <p class="tagline">Impresión 3D, Corte Láser y Regalos Personalizados</p>
      </div>
    </div>
  </header>

  <!-- 2. BARRA DE NAVEGACIÓN PEGAJOSA -->
  <nav class="sticky-navbar">
    <div class="nav-brand">
      <img src="img/logo.webp" alt="Logo" class="logo-mini" onerror="this.onerror=null; this.src='https://placehold.co/32x32?text=DJ';">
      <span class="brand-title">Mr.Pollería Don Juan</span>
    </div>
    <div id="nav-wrapper"></div>
  </nav>

  <!-- Contenido Principal de la Portada -->
  <div class="container">
    
    <!-- 1. TRABAJOS REALES (Carrusel de entregas a clientes) -->
    <section id="carousel-container"></section>

    <!-- 2. DESTACADOS Y NOVEDADES -->
    <section id="destacados-seccion" class="destacados-section destacados-card">
      <div class="section-header">
        <h2>Destacados y Novedades</h2>
        <p>Los más pedidos y las últimas creaciones del taller</p>
      </div>

      <!-- Grilla donde JS inyectará las tarjetas de productos -->
      <div id="featured-products-grid" class="products-grid"></div>

      <!-- Botón para ir al Catálogo completo -->
      <div class="catalog-cta-wrapper">
        <a href="paginas/productos.html" class="btn-catalog-cta">
          <span>Ver Catálogo Completo</span>
          <i class="fa-solid fa-arrow-right"></i>
        </a>
      </div>
    </section>

    <!-- 3. PREVIEW DE RESEÑAS / CLIENTES -->
    <section id="resenas-seccion" class="destacados-section destacados-card" style="margin-top: 30px;">
      <div class="section-header">
        <h2>Lo que dicen nuestros clientes</h2>
        <p>Opiniones reales de personas que han confiado en nuestro taller</p>
      </div>

      <!-- Grilla donde resenas-inicio.js inyectará las opiniones -->
      <div id="resenas-preview-grid" class="resenas-grid"></div>
    </section>

  </div>

  <!-- Pie de página (Inyectado por JS) -->
  <div id="footer-container"></div>

  <!-- Contenedor para el Modal de Imagen -->
  <div id="modal-container"></div>

  <!-- Firebase Compat (SDKs) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <!-- Script Principal de la Portada (Módulo Orquestador) -->
  <script type="module" src="js/paginas/inicio/main-inicio.js"></script>

</body>
</html>
