<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mr. Pollería Don Juan</title>
  <link rel="icon" type="image/webp" href="img/logo.webp?v=2">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Globales y Componentes Base -->
  <link rel="stylesheet" href="css/globales/base.css">
  <link rel="stylesheet" href="css/globales/layout.css">
  <link rel="stylesheet" href="css/componentes/buttons.css">
  <link rel="stylesheet" href="css/componentes/nav.css">
  <link rel="stylesheet" href="css/componentes/modal.css">
  <link rel="stylesheet" href="css/componentes/footer.css">

  <!-- Estilos de Inicio -->
  <link rel="stylesheet" href="css/paginas/inicio/header.css">
  <link rel="stylesheet" href="css/paginas/inicio/banners.css">
  <link rel="stylesheet" href="css/paginas/inicio/carousel.css">
  
  <!-- Estilos para las tarjetas de productos -->
  <link rel="stylesheet" href="css/paginas/productos/products.css">
</head>

<body>

  <!-- 1. BLOQUE PRINCIPAL (HERO / BANNER) -->
  <header class="hero-header" id="inicio">
    <div class="hero-card">
      <img src="img/logo.webp" alt="Mr. Pollería Don Juan Logo" class="logo-hero" onerror="this.onerror=null; this.src='https://placehold.co/110x110?text=Don+Juan';">
      <div class="hero-text">
        <h1>Mr. Pollería Don Juan</h1>
        <p class="tagline">Impresión 3D, Corte Láser y Regalos Personalizados</p>
      </div>
    </div>
  </header>

  <!-- 2. BARRA DE NAVEGACIÓN PEGAJOSA -->
  <nav class="sticky-navbar">
    <div class="nav-brand">
      <img src="img/logo.webp" alt="Logo" class="logo-mini" onerror="this.onerror=null; this.src='https://placehold.co/32x32?text=DJ';">
      <span class="brand-title">Mr.Pollería Don Juan</span>
    </div>
    <div id="nav-wrapper"></div>
  </nav>

  <!-- Contenido Principal de la Portada -->
  <div class="container">
    
    <!-- TRABAJOS REALES (Carrusel de entregas a clientes) -->
    <section id="carousel-container"></section>

    <!-- DESTACADOS Y NOVEDADES (Grilla reducida de 6 productos) -->
    <section id="destacados-seccion" class="destacados-section">
      <div class="section-header">
        <h2>Destacados y Novedades</h2>
        <p>Los más pedidos y las últimas creaciones del taller</p>
      </div>

      <!-- Grilla donde JS inyectará las 6 tarjetas -->
      <div id="featured-products-grid" class="products-grid"></div>

      <!-- Botón para ir al Catálogo completo -->
      <div class="catalog-cta-wrapper">
        <a href="paginas/productos.html" class="btn-catalog-cta">
          <span>Ver Catálogo Completo</span>
          <i class="fa-solid fa-arrow-right"></i>
        </a>
      </div>
    </section>

  </div>

  <!-- Pie de página (Inyectado por JS) -->
  <div id="footer-container"></div>

  <!-- Contenedor para el Modal de Imagen -->
  <div id="modal-container"></div>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <!-- Script Principal del Inicio -->
  <script type="module" src="js/paginas/inicio/main-inicio.js"></script>
</body>
</html>
